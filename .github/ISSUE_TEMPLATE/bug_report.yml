name: Bug Report
description: File a structured bug report to help us improve Condense
title: '[BUG]: '
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        ### Thanks for reporting a Condense issue
        Please fill out the form below with the real usage mode, asset type, and reproduction steps so we can investigate quickly.

  - type: dropdown
    id: usage_mode
    attributes:
      label: How are you using Condense?
      description: Select the integration style that matches your setup.
      options:
        - 'CLI'
        - 'Standalone server / API'
        - 'Express middleware'
        - 'Programmatic SDK'
    validations:
      required: true

  - type: input
    id: package_version
    attributes:
      label: Package Version
      description: Which version of Condense are you using?
      placeholder: 'e.g. 0.3.11'
    validations:
      required: false

  - type: input
    id: asset_type
    attributes:
      label: Asset Type / MIME Type
      description: What file or MIME type causes the issue?
      placeholder: 'e.g. image/png, text/html, video/mp4'
    validations:
      required: true

  - type: dropdown
    id: optimization_method
    attributes:
      label: Optimization Method
      description: Which optimization mode was selected when the bug appeared?
      options:
        - 'quality'
        - 'balanced'
        - 'extreme'
    validations:
      required: true

  - type: input
    id: file_size
    attributes:
      label: Approximate File Size
      description: Optional size hint for faster triage.
      placeholder: 'e.g. 15MB'
    validations:
      required: false

  - type: textarea
    id: description
    attributes:
      label: Describe the Bug
      description: A clear and concise summary of the observed issue.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Share the exact commands, code, or request flow that reproduce the bug.
      placeholder: |
        1. Run ...
        2. Optimize ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected_behavior
    attributes:
      label: Expected Behavior
      description: What did you expect to happen instead?
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment Information
      description: Include the runtime details most relevant to debugging.
      placeholder: |
        - OS: [e.g. Ubuntu 24.04]
        - Node.js Version: [e.g. v20.11.0]
        - FFmpeg Version: [e.g. v6.0]
    validations:
      required: true
