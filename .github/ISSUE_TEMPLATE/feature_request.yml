name: Feature Request
description: Suggest an idea or improvement for Condense
title: '[FEATURE]: '
labels: ['enhancement']
body:
  - type: markdown
    attributes:
      value: |
        ### Suggest an Enhancement
        Share the workflow gap, the proposed behavior, and any constraints that would help us judge the change.

  - type: textarea
    id: problem_statement
    attributes:
      label: Problem Statement
      description: What user workflow or platform limitation is driving this request?
      placeholder: 'e.g. I need Condense to support ... when optimizing ...'
    validations:
      required: true

  - type: textarea
    id: proposed_solution
    attributes:
      label: Proposed Solution
      description: Describe the behavior or API shape you would like to see.
    validations:
      required: true

  - type: textarea
    id: constraints
    attributes:
      label: Constraints or Compatibility Notes
      description: Mention any compatibility, performance, security, or API concerns that should be considered.
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any workarounds, existing libraries, or partial solutions you have evaluated.
    validations:
      required: false

  - type: textarea
    id: additional_context
    attributes:
      label: Additional Context
      description: Add benchmarks, screenshots, links, or any supporting information.
    validations:
      required: false
